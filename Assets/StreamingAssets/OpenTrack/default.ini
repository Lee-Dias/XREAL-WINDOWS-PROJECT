[migrations]
last-migration-at=20220126_00~

[modules]
tracker-dll=xreal-one
protocol-dll=udp
filter-dll=accela

[udp-proto]
ip2=0
ip4=1
ip1=127

[udp-tracker]
port=4242

[opentrack-ui]
yaw-invert-sign=true
keycode-center=F12
neck-enable=false
compensate-translation-disable-source-pitch=false
compensate-translation-disable-y-axis=false
relative-translation-mode=0
compensate-translation-disable-z-axis=false
compensate-translation-disable-x-axis=false
compensate-translation-disable-source-yaw=false
compensate-translation-disable-source-roll=false
centering-mode=0
center-at-startup=false

[xreal-one-tracker]
use-fusion-offset=false
changed=true

[spline-yaw]
points=@Variant(\0\0\0\x7f\0\0\0\xfQList<QPointF>\0\0\0\0\0)

[spline-roll]
points=@Variant(\0\0\0\x7f\0\0\0\xfQList<QPointF>\0\0\0\0\0)

[spline-pitch]
points=@Variant(\0\0\0\x7f\0\0\0\xfQList<QPointF>\0\0\0\0\0)

[opentrack-mappings]
pitch-max-value=90
pitch-max-output-value=-180
pitch-alt-axis-sign=false
